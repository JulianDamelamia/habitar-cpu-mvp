{% extends "base.html" %}
{% block title %}Mi perfil{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto surface-card radius-card elevation-card p-8">
  <h1 class="type-heading weight-bold mb-4">Mi perfil</h1>

  <form method="post" action="{{ url_for('perfil_update').path }}" class="space-y-4">
    <dl class="grid sm:grid-cols-2 gap-3 type-body-small">
      <div><label class="surface-page radius-control p-3">Nombre</label><input name="nombre" value="{{ user.nombre }}" required class="w-full border-width radius-control px-3 py-2"></div>
      <div><label class="surface-page radius-control p-3">Apellido</label><input name="apellido" value="{{ user.apellido }}" required class="w-full border-width radius-control px-3 py-2"></div>
      <div class="surface-page radius-control p-3"><dt class="text-subtle">Email</dt><dd class="weight-medium">{{ user.email }}</dd></div>
      {% if user.estudiante and user.estudiante.carrera %}
        <div class="surface-page radius-control p-3"><dt class="text-subtle">Carrera</dt><dd class="weight-medium">{{ user.estudiante.carrera.tipo.nombre}} {{ user.estudiante.carrera.nombre}}</dd></div>
      {% endif %}
    </dl>
    <button class="surface-brand surface-brand-hover text-on-contrast radius-control px-5 py-2 weight-medium">Guardar</button>
  </form>


</div>
{% endblock %}
