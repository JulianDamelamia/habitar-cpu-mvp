{% extends "base.html" %}
{% block title %}Crear cuenta - {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 surface-card radius-card elevation-card p-8">
  <h1 class="type-heading weight-bold mb-1">Crear cuenta</h1>
  {% if error %}<div class="mb-4 radius-control surface-danger border-width border-danger-strong text-danger-contrast px-4 py-2 type-body-small">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('signup_submit').path }}" class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block type-body-small weight-medium mb-1">Nombre</label><input name="nombre" value="{{ nombre or '' }}" required class="w-full border-width radius-control px-3 py-2"></div>
      <div><label class="block type-body-small weight-medium mb-1">Apellido</label><input name="apellido" value="{{ apellido or '' }}" required class="w-full border-width radius-control px-3 py-2"></div>
    </div>
    <div>
      <label class="block type-body-small weight-medium mb-1">Email</label>
      <input name="email" type="email" value="{{ email or '' }}" required class="w-full border-width radius-control px-3 py-2">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block type-body-small weight-medium mb-1">Carrera</label><input name="carrera" value="{{ carrera or '' }}" class="w-full border-width radius-control px-3 py-2"></div>
    </div>
    <div>
      <label class="block type-body-small weight-medium mb-1">Contraseña</label>
      <input name="password" type="password" required minlength="6" class="w-full border-width radius-control px-3 py-2">
    </div>
    <button class="w-full surface-brand surface-brand-hover text-on-contrast radius-control py-2 weight-medium">Crear cuenta</button>
  </form>
  <p class="mt-5 type-body-small text-secondary">¿Ya tenés cuenta? <a href="{{ url_for('login_form').path }}" class="text-link hover-text-underline">Ingresá</a></p>
</div>
{% endblock %}
