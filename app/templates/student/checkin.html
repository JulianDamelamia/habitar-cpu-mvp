{% extends "base.html" %}
{% block title %}Registrar asistencia{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="type-heading weight-bold mb-1">Registrar asistencia</h1>
  <p class="text-muted mb-5 type-body-small">Escaneá el código QR que muestra el docente, o ingresá el código de 6 dígitos.</p>

  <div class="surface-card radius-card elevation-card p-5 mb-4">
    <div id="reader" class="radius-control overflow-hidden"></div>
    <button id="start" class="mt-3 w-full surface-dark-strong surface-dark-hover text-on-contrast radius-control py-2 type-body-small inline-flex items-center justify-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i> Activar cámara</button>
    <p id="scan-status" class="type-caption text-subtle mt-2"></p>
  </div>

  <form method="post" action="{{ url_for('checkin_submit').path }}" class="surface-card radius-card elevation-card p-5">
    <label class="block type-body-small weight-medium mb-1">Código de 6 dígitos</label>
    <div class="flex gap-2">
      <input id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]*" required class="flex-1 border-width radius-control px-3 py-2 type-subheading tracking-widest text-align-center" placeholder="000000">
      <button class="surface-brand surface-brand-hover text-on-contrast radius-control px-5 py-2 weight-medium">Validar</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const statusEl = document.getElementById('scan-status');
  let scanner = null;
  document.getElementById('start').addEventListener('click', () => {
    if (!window.Html5Qrcode) { statusEl.textContent = 'No se pudo cargar el escáner. Usá el código manual.'; return; }
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      (text) => {
        statusEl.textContent = 'Código leído: ' + text;
        document.getElementById('codigo').value = text.trim();
        scanner.stop().then(() => document.querySelector('form').submit());
      },
      () => {}
    ).catch(() => { statusEl.textContent = 'No se pudo abrir la cámara. Usá el código manual.'; });
  });
</script>
{% endblock %}
