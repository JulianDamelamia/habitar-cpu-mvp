{% extends "base.html" %}
{% block title %}Encuesta{% endblock %}
{% block content %}
<div class="max-w-md mx-auto surface-card radius-card elevation-card p-6">
  <h1 class="type-title-small weight-bold mb-1">¿Qué te pareció?</h1>
  <p class="text-muted type-body-small mb-4">{{ a.titulo }}</p>
  {% if answered %}
    <div class="mb-4 radius-control surface-muted px-4 py-2 type-body-small text-secondary">Ya respondiste (<i data-lucide="star" class="inline-block w-4 h-4 icon-baseline-align"></i> {{ answered.rating }}). Podés actualizar tu respuesta.</div>
  {% endif %}
  <form method="post" action="{{ url_for('survey_submit', actividad_id=a.id).path }}" class="space-y-4">
    <div>
      <label class="block type-body-small weight-medium mb-2">Tu valoración</label>
      <div class="flex gap-2" id="stars">
        {% for n in [1,2,3,4,5] %}
        <label class="cursor-interactive">
          <input type="radio" name="rating" value="{{ n }}" class="sr-only peer" {% if answered and answered.rating==n %}checked{% endif %} {% if n==5 and not answered %}checked{% endif %}>
          <i data-lucide="star" class="w-8 h-8 text-on-dark-muted rating-selected"></i>
        </label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="block type-body-small weight-medium mb-1">Comentario (opcional)</label>
      <textarea name="comment" rows="3" class="w-full border-width radius-control px-3 py-2">{{ answered.comment if answered and answered.comment else '' }}</textarea>
    </div>
    <div class="flex gap-2">
      <button class="surface-brand surface-brand-hover text-on-contrast radius-control px-5 py-2 weight-medium">Enviar</button>
      <a href="{{ url_for('home').path }}" class="text-muted px-3 py-2 type-body-small hover-text-underline">Omitir</a>
    </div>
  </form>
</div>
{% endblock %}
